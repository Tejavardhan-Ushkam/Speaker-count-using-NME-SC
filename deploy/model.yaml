# Model served by the website (speakercount/infer.py). Switch models by editing this file only.
method: nmesc_ecapa                    # NME-SC spectral clustering on ECAPA embeddings, exact eigensolver, no post-processing
display_name: "NME-SC on ECAPA speaker embeddings (p_min 4)"
p_min: 4                               # floor on graph neighbours (chosen on validation); stops short clips from shattering
k_max: 25                              # largest count the model can return (as in the VoxConverse evaluation)
device: cpu                            # free hosting has no GPU; env SPEAKERCOUNT_DEVICE=cuda overrides
scope: "Most reliable for 1-6 speakers. With many speakers (10+) it tends to under-count."
measured_accuracy:                     # held-out test sets, automatic speech detection (pyannote), exactly as on this website
  "VoxConverse test, 1-6 speakers (117 recordings)": {exact: 0.64, within_1: 0.86, mae: 0.67}
  "VoxConverse test, all (232 recordings, 1-21 speakers)": {exact: 0.46, within_1: 0.64, mae: 1.47}
  "AMI meetings test (16 meetings, 3-4 speakers)": {exact: 0.69, within_1: 0.94, mae: 0.38}
